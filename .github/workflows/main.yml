name: Build OnePlus Kernel Module (AUTO FIX PGO + LLVM)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make git clang llvm lld python3

    - name: Set environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV

    - name: Fix PGO config automatically (IMPORTANT)
      run: |
        echo "Disabling PGO if enabled..."
        find . -type f -name "*defconfig*" -o -name "config*" | while read file; do
          sed -i 's/CONFIG_PGO=y/CONFIG_PGO=n/g' "$file" || true
        done

    - name: Verify toolchain
      run: |
        clang --version
        ld.lld --version

    - name: Safe clean (avoid PGO crash)
      run: |
        make clean || true
        make mrproper || true

    - name: Apply defconfig
      run: |
        make ARCH=arm64 LLVM=1 defconfig

    - name: Prepare build system
      run: |
        make ARCH=arm64 LLVM=1 modules_prepare

    - name: Build modules
      run: |
        make -j$(nproc) ARCH=arm64 LLVM=1 M=filetest modules

    - name: Check output
      run: |
        find filetest -name "*.ko" || true
        ls -lah filetest || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: filetest/*.ko
