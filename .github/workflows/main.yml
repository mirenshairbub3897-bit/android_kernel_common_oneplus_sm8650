name: Build OnePlus Kernel Module (LLVM FIXED)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies (LLVM toolchain)
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make git \
          clang llvm lld python3 curl wget zip

    - name: Set environment (Android Kernel LLVM)
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV

    - name: Verify toolchain
      run: |
        clang --version
        ld.lld --version

    - name: Clean kernel tree
      run: |
        make clean
        make mrproper || true

    - name: Apply defconfig (YOUR DEVICE CONFIG)
      run: |
        make ARCH=arm64 LLVM=1 defconfig

    - name: Prepare kernel build system
      run: |
        make ARCH=arm64 LLVM=1 modules_prepare

    - name: Build kernel modules
      run: |
        make -j$(nproc) ARCH=arm64 LLVM=1 M=filetest modules

    - name: Verify output
      run: |
        echo "Checking .ko files..."
        find filetest -type f -name "*.ko" || true
        ls -lah filetest || true

    - name: Upload kernel modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: filetest/*.ko
