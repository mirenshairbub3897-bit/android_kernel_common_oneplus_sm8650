name: Build Kernel Module (OP-WILD FIXED)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make git clang llvm lld python3 gcc-aarch64-linux-gnu

    - name: Set environment (IMPORTANT FIX)
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "KERNEL_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV

    - name: Prepare kernel build system
      run: |
        make ARCH=arm64 defconfig || true
        make ARCH=arm64 modules_prepare

    - name: Build module
      run: |
        make -C $GITHUB_WORKSPACE M=filetest ARCH=arm64 modules

    - name: Verify output
      run: |
        find filetest -name "*.ko"
        ls -lah filetest

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hello-ko
        path: filetest/*.ko
