name: Build OnePlus Kernel Module

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make git \
          clang llvm lld \
          python3 gcc-aarch64-linux-gnu

    - name: Setup environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV

    - name: Verify toolchain
      run: |
        clang --version
        ld.lld --version

    - name: Prepare kernel build system
      run: |
        make ARCH=arm64 O=out defconfig || true
        make ARCH=arm64 O=out modules_prepare || true

    - name: Build kernel module
      run: |
        make ARCH=arm64 O=out M=filetest modules

    - name: Show output
      run: |
        ls -lah filetest || true

    - name: Upload .ko file
      uses: actions/upload-artifact@v4
      with:
        name: hello-ko
        path: filetest/*.ko
